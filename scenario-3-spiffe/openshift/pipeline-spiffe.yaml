apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: rhtas-hello-world-spiffe
  namespace: rhtas-demo-ci
  labels:
    rhtas.demo/scenario: spiffe
spec:
  params:
    - name: quay-org
      type: string
    - name: quay-repo
      type: string
      default: rhtas-hello-world
    - name: git-url
      type: string
      default: https://github.com/navyseal8/rhtas-cosign-openshift.git
    - name: git-revision
      type: string
      default: main
    - name: spire-oidc-issuer
      type: string
      description: Must match SpireServer / SpireOIDCDiscoveryProvider jwtIssuer
    - name: fulcio-url
      type: string
      description: RHTAS Fulcio Ready URL
    - name: rekor-url
      type: string
      description: RHTAS Rekor Ready URL
    - name: tuf-url
      type: string
      description: RHTAS TUF Ready URL
    - name: tuf-root-checksum
      type: string
      description: sha256 of TUF 1.root.json (cosign initialize --root-checksum)
  workspaces:
    - name: shared-workspace
    - name: docker-credentials
    - name: git-credentials
      optional: true
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
          optional: true
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
    - name: maven-build
      runAfter: [fetch-source]
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: sast
      runAfter: [maven-build]
      taskRef:
        name: sast-semgrep
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-push
      runAfter: [sast]
      taskRef:
        name: buildah-push
      serviceAccountName: spiffe-cosign-signer
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: quay.io/$(params.quay-org)/$(params.quay-repo):spiffe-$(context.pipelineRun.uid)
        - name: BUILD_VERSION
          value: spiffe-$(context.pipelineRun.name)

    - name: spiffe-sign
      runAfter: [build-push]
      taskRef:
        name: spiffe-cosign-sign
      serviceAccountName: spiffe-cosign-signer
      params:
        # Prefer digest from build-push (Cosign warns on tags; avoids TOCTOU)
        - name: IMAGE
          value: quay.io/$(params.quay-org)/$(params.quay-repo)@$(tasks.build-push.results.IMAGE_DIGEST)
        - name: SPIRE_OIDC_ISSUER
          value: $(params.spire-oidc-issuer)
        - name: FULCIO_URL
          value: $(params.fulcio-url)
        - name: REKOR_URL
          value: $(params.rekor-url)
        - name: TUF_URL
          value: $(params.tuf-url)
        - name: TUF_ROOT_CHECKSUM
          value: $(params.tuf-root-checksum)
      podTemplate:
        labels:
          rhtas.demo/signer: "true"
