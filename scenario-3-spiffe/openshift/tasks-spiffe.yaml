apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: spiffe-cosign-sign
  namespace: rhtas-demo-ci
spec:
  params:
    - name: IMAGE
      type: string
    - name: SPIRE_OIDC_ISSUER
      type: string
      description: SpireOIDCDiscoveryProvider jwtIssuer (JWT iss / Fulcio OIDC issuer)
    - name: FULCIO_URL
      type: string
    - name: REKOR_URL
      type: string
    - name: TUF_URL
      type: string
      description: RHTAS TUF Ready URL (trusted_root for SCT / CA during keyless sign)
    - name: TUF_ROOT_CHECKSUM
      type: string
      description: sha256 of TUF 1.root.json (cosign initialize --root-checksum)
  workspaces:
    - name: dockerconfig
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: cosign-home
      emptyDir: {}
  stepTemplate:
    env:
      - name: HOME
        value: /tekton/home
      - name: SPIFFE_ENDPOINT_SOCKET
        value: unix:///spiffe-workload-api/agent.sock
      - name: DOCKER_CONFIG
        value: $(workspaces.dockerconfig.path)
      - name: COSIGN_YES
        value: "true"
      - name: COSIGN_MIRROR
        value: $(params.TUF_URL)
      - name: COSIGN_ROOT
        value: $(params.TUF_URL)/1.root.json
    volumeMounts:
      - name: spiffe-workload-api
        mountPath: /spiffe-workload-api
        readOnly: true
      - name: cosign-home
        mountPath: /tekton/home
  steps:
    # hi/cosign is distroless (no bash).
    # Cosign 3 defaults to --use-signing-config=true. A custom OIDC issuer (SPIRE)
    # counts as a "service URL" and errors with:
    #   cannot specify service URLs and use signing config
    # For private RHTAS + SPIFFE, disable signing-config and pass Fulcio/Rekor/OIDC.
    - name: tuf-init
      image: registry.access.redhat.com/hi/cosign:3.1.1
      command: ["cosign"]
      args:
        - initialize
        - --mirror=$(params.TUF_URL)
        - --root=$(params.TUF_URL)/1.root.json
        - --root-checksum=$(params.TUF_ROOT_CHECKSUM)
    - name: sign-with-spiffe
      image: registry.access.redhat.com/hi/cosign:3.1.1
      command: ["cosign"]
      args:
        - sign
        - -y
        - --use-signing-config=false
        - --new-bundle-format=false
        - --fulcio-url=$(params.FULCIO_URL)
        - --rekor-url=$(params.REKOR_URL)
        - --oidc-issuer=$(params.SPIRE_OIDC_ISSUER)
        # JWT-SVID from SPIFFE_ENDPOINT_SOCKET (audience sigstore)
        - $(params.IMAGE)
