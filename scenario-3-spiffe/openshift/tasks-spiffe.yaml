apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: spiffe-cosign-sign
  namespace: rhtas-demo-ci
spec:
  params:
    - name: IMAGE
      type: string
      description: Image reference to sign (prefer digest, e.g. quay.io/org/repo@sha256:…)
    - name: SPIRE_OIDC_ISSUER
      type: string
      description: SpireOIDCDiscoveryProvider jwtIssuer (JWT iss / Fulcio OIDC issuer)
    - name: FULCIO_URL
      type: string
    - name: REKOR_URL
      type: string
    - name: TUF_URL
      type: string
      description: RHTAS TUF Ready URL (trusted_root for SCT / CA during keyless sign)
    - name: TUF_ROOT_CHECKSUM
      type: string
      description: sha256 of TUF 1.root.json (cosign initialize --root-checksum)
  workspaces:
    - name: dockerconfig
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    # Cosign HOME (TUF + signing-config). Do not write here as root in an earlier step —
    # OpenShift assigns a random UID to later steps and they must own this volume.
    - name: cosign-home
      emptyDir: {}
    # Registry auth outside HOME so Tekton's /tekton/creds → $HOME/.docker copy is not blocked.
    - name: registry-auth
      emptyDir: {}
  stepTemplate:
    env:
      - name: HOME
        value: /tekton/home
      - name: DOCKER_CONFIG
        value: /registry-auth
      - name: SPIFFE_ENDPOINT_SOCKET
        value: unix:///spiffe-workload-api/agent.sock
      - name: COSIGN_YES
        value: "true"
      - name: COSIGN_MIRROR
        value: $(params.TUF_URL)
      - name: COSIGN_ROOT
        value: $(params.TUF_URL)/1.root.json
    volumeMounts:
      - name: spiffe-workload-api
        mountPath: /spiffe-workload-api
        readOnly: true
      - name: cosign-home
        mountPath: /tekton/home
      - name: registry-auth
        mountPath: /registry-auth
  steps:
    # Quay secret mounts as .dockerconfigjson; Cosign needs $DOCKER_CONFIG/config.json.
    # chmod a+rX so the non-root cosign UID can read it.
    - name: setup-registry-auth
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/bin/bash
        set -euo pipefail
        mkdir -p /registry-auth
        cfg="$(workspaces.dockerconfig.path)"
        if [[ -f "${cfg}/.dockerconfigjson" ]]; then
          cp "${cfg}/.dockerconfigjson" /registry-auth/config.json
        elif [[ -f "${cfg}/config.json" ]]; then
          cp "${cfg}/config.json" /registry-auth/config.json
        else
          echo "No docker config in workspace ${cfg}:" >&2
          ls -la "${cfg}" >&2 || true
          exit 1
        fi
        chmod 0755 /registry-auth
        chmod 0644 /registry-auth/config.json
        echo "Registry auth ready at ${DOCKER_CONFIG}/config.json"
    - name: tuf-init
      image: registry.access.redhat.com/hi/cosign:3.1.1
      command: ["cosign"]
      args:
        - initialize
        - --mirror=$(params.TUF_URL)
        - --root=$(params.TUF_URL)/1.root.json
        - --root-checksum=$(params.TUF_ROOT_CHECKSUM)
    # Cosign 3: Fulcio / Rekor / OIDC live in a signing config (not --fulcio-url etc.).
    - name: create-signing-config
      image: registry.access.redhat.com/hi/cosign:3.1.1
      command: ["cosign"]
      args:
        - signing-config
        - create
        - --no-default-fulcio
        - --no-default-rekor
        - --no-default-oidc
        - --no-default-tsa
        - --fulcio=url=$(params.FULCIO_URL),api-version=1,start-time=2020-01-01T00:00:00Z,operator=redhat.com
        - --rekor=url=$(params.REKOR_URL),api-version=1,start-time=2020-01-01T00:00:00Z,operator=redhat.com
        - --rekor-config=ANY
        - --oidc-provider=url=$(params.SPIRE_OIDC_ISSUER),api-version=1,start-time=2020-01-01T00:00:00Z,operator=spire
        - --out=/tekton/home/signing-config.json
    - name: sign-with-spiffe
      image: registry.access.redhat.com/hi/cosign:3.1.1
      command: ["cosign"]
      args:
        - sign
        - -y
        - --signing-config=/tekton/home/signing-config.json
        # JWT-SVID from SPIFFE_ENDPOINT_SOCKET (audience sigstore)
        - $(params.IMAGE)
