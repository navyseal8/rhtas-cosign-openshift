# Registers Tekton signer pods for automatic SPIFFE identity issuance.
# Requires Zero Trust Workload Identity Manager + SPIRE stack (see README Setup SPIFFE).
#
# TRUST_DOMAIN must match ZeroTrustWorkloadIdentityManager.spec.trustDomain
# (usually the OpenShift apps domain, e.g. apps.cluster-xxx.example.com).
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: rhtas-tekton-signer
spec:
  spiffeIDTemplate: "spiffe://${TRUST_DOMAIN}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      rhtas.demo/signer: "true"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: rhtas-demo-ci
  jwtTtl: 5m
