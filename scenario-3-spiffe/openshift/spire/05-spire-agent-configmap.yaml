# Operator-managed name/namespace — applied AFTER SpireAgent is Ready.
# SpireAgent CR has no kubelet_url field; on many lab/SNO clusters the node
# hostname is not in CoreDNS, so the k8s workload attestor fails with:
#   lookup <nodeName>: no such host → OIDC provider stays 0/1
#
# Fix: set kubelet_url to the node InternalIP (works on single-node / SNO).
# Requires SpireAgent annotation ztwim.openshift.io/create-only=true (see 02-spire-agent.yaml).
#
# Render with:  ./openshift/spire/apply-agent-config.sh
# Or manually:
#   export NODE_IP=... TRUST_DOMAIN=... CLUSTER_NAME=...
#   envsubst < openshift/spire/05-spire-agent-configmap.yaml | oc apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: zero-trust-workload-identity-manager
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/instance: cluster-zero-trust-workload-identity-manager
    app.kubernetes.io/managed-by: zero-trust-workload-identity-manager
data:
  agent.conf: |
    {
      "agent": {
        "data_dir": "/var/lib/spire",
        "log_format": "text",
        "log_level": "info",
        "rebootstrap_mode": "auto",
        "sds": {
          "default_all_bundles_name": "ROOTCA",
          "default_bundle_name": "null"
        },
        "server_address": "spire-server.zero-trust-workload-identity-manager",
        "server_port": "443",
        "socket_path": "/tmp/spire-agent/public/spire-agent.sock",
        "trust_bundle_path": "/run/spire/bundle/bundle.crt",
        "trust_domain": "${TRUST_DOMAIN}"
      },
      "health_checks": {
        "bind_address": "0.0.0.0",
        "bind_port": 9982,
        "listener_enabled": true,
        "live_path": "/live",
        "ready_path": "/ready"
      },
      "plugins": {
        "KeyManager": [
          {
            "memory": {
              "plugin_data": null
            }
          }
        ],
        "NodeAttestor": [
          {
            "k8s_psat": {
              "plugin_data": {
                "cluster": "${CLUSTER_NAME}"
              }
            }
          }
        ],
        "WorkloadAttestor": [
          {
            "k8s": {
              "plugin_data": {
                "disable_container_selectors": false,
                "kubelet_ca_path": "/etc/kubernetes/kubelet-ca.crt",
                "kubelet_url": "https://${NODE_IP}:10250",
                "node_name_env": "MY_NODE_NAME",
                "skip_kubelet_verification": false,
                "use_new_container_locator": true,
                "verbose_container_locator_logs": false
              }
            }
          }
        ]
      },
      "telemetry": {
        "Prometheus": {
          "host": "0.0.0.0",
          "port": "9402"
        }
      }
    }
