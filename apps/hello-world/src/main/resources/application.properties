server.port=8080
management.endpoints.web.exposure.include=health,info
spring.thymeleaf.cache=false

app.build.version=${BUILD_VERSION:local-dev}
app.image.digest=${IMAGE_DIGEST:unknown}
app.image.ref=${IMAGE_REF:unknown}
app.signer.identity=${SIGNER_IDENTITY:unsigned}
app.signed.at=${SIGNED_AT:unknown}
app.scenario=${SCENARIO:unknown}
app.fulcio.url=${FULCIO_URL:unknown}
app.rekor.url=${REKOR_URL:unknown}
app.oidc.issuer=${OIDC_ISSUER:unknown}
app.git.commit=${GIT_COMMIT:unknown}
app.builder.image=${BUILDER_IMAGE:registry.access.redhat.com/ubi9/openjdk-21:1.21}
app.runtime.image=${RUNTIME_IMAGE:registry.access.redhat.com/hi/openjdk:21.0.11-runtime}
app.tuf.url=${TUF_URL:unknown}
app.cosign.image=${COSIGN_IMAGE:registry.redhat.io/rhtas/cosign-rhel9}
