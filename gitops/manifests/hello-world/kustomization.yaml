apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhtas-demo-dev

resources:
  - namespace.yaml
  - trust-configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

# `name` must match the image string in deployment.yaml exactly (before retagging).
images:
  - name: quay.io/rhn_support_jeretan/hello-world-cosign
    newName: quay.io/rhn_support_jeretan/hello-world-cosign
    newTag: tekton-5ccb3a15-209e-4d56-aed2-1b1fe8208c6f

# Modern Kustomize: `labels` is a list of transformers (not a map).
# includeSelectors: false — do not mutate Deployment/Service selectors (immutable).
# includeTemplates: true — also label pod templates.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: hello-world
      app.kubernetes.io/part-of: rhtas-cosign-demos
