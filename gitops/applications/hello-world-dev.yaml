apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhtas-cosign-demos
spec:
  project: default
  source:
    # Update to your GitHub repository
    repoURL: https://github.com/navyseal8/rhtas-cosign-openshift.git
    targetRevision: main
    path: gitops/manifests/hello-world
    # Do NOT set source.directory.recurse — that treats kustomization.yaml as a
    # cluster CRD. With kustomization.yaml present, Argo CD runs `kustomize build`.
  destination:
    server: https://kubernetes.default.svc
    namespace: rhtas-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
