apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-chains-builder
  namespace: rhtas-demo-ci
  labels:
    app.kubernetes.io/component: tekton-builder
# Chains reads dockerconfig from SA secrets when uploading OCI signatures.
# Buildah also uses the PipelineRun docker-credentials workspace (same Secret).
secrets:
  - name: quay-credentials
imagePullSecrets:
  - name: quay-credentials
