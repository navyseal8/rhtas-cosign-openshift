# Merge-patch for the existing TektonConfig named "config".
# Apply with:
#   oc patch tektonconfig config --type=merge --patch-file=chains-tektonconfig-patch.yaml
#
# Validate keys for your version:
#   oc explain tektonconfig.spec.chain
#
#
# FULCIO=$(oc get fulcio -n trusted-artifact-signer -o jsonpath='{.items[0].status.url}')
# REKOR=$(oc get rekor -n trusted-artifact-signer -o jsonpath='{.items[0].status.url}')
# TUF=$(oc get tuf -n trusted-artifact-signer -o jsonpath='{.items[0].status.url}')
# echo "$FULCIO / $REKOR / $TUF"
#
spec:
  chain:
    # OCI image signatures stored next to the image in the registry
    artifacts.oci.format: simplesigning
    artifacts.oci.storage: oci
    artifacts.oci.signer: x509
    # Provenance attestations
    artifacts.taskrun.format: in-toto
    artifacts.taskrun.storage: oci
    artifacts.taskrun.signer: x509
    # Transparency log — MUST be your RHTAS Rekor, or Chains defaults to
    # https://rekor.sigstore.dev and verify against RHTAS TUF will fail.
    # (chains-rhtas-env ConfigMap is NOT mounted into the controller.)
    transparency.enabled: true
    transparency.url: "https://rekor-server-trusted-artifact-signer.apps.cluster-5zgfn.dyn.redhatworkshops.io"
    # Keyless via Fulcio (x509 signer), not a static cosign private key
    # TektonConfig expects a real bool here (not the string "true")
    signers.x509.fulcio.enabled: true
    # Replace with your Fulcio URL after: oc get fulcio -n trusted-artifact-signer
    # Use the Ready URL from the CR (OpenShift Route), not a made-up short DNS name.
    signers.x509.fulcio.address: "https://fulcio-server-trusted-artifact-signer.apps.cluster-5zgfn.dyn.redhatworkshops.io"
    # Must match Authentication.spec.serviceAccountIssuer / token iss
    signers.x509.fulcio.issuer: "https://kubernetes.default.svc"
